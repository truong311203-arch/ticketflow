services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketflow-api
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - PORT=8080
      - LOG_LEVEL=debug
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=ticketflow_user
      - DB_PASSWORD=ticketflow_secret
      - DB_NAME=ticketflow_db
      - DB_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ticketflow-postgres
    environment:
      POSTGRES_USER: ticketflow_user
      POSTGRES_PASSWORD: ticketflow_secret
      POSTGRES_DB: ticketflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow_user -d ticketflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
